[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunt-pipeline"
version = "0.1.0"
description = "Source, enrich, score and shortlist remote job ads, and flag the ones that are remote in name only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6", "python-jobspy>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[tool.setuptools.packages.find]
include = ["jobhunt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
